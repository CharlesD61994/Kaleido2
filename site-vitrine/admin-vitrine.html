<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier Kaleido - Accueil boutique</title>
    <meta
      name="description"
      content="Module admin Atelier Kaleido pour choisir les catégories et les produits affichés sur l'accueil de la boutique."
    />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <main class="phone-shell" aria-label="Accueil boutique admin Atelier Kaleido">
      <section class="storefront admin-storefront">
        <header class="topbar admin-topbar" aria-label="Navigation admin">
          <a class="admin-back-button admin-header-back" href="./admin.html" aria-label="Retour">←</a>
          <a class="brand" href="./admin.html" aria-label="Retour au tableau de bord admin">
            <img src="./assets/kaleido-logo.jpg" alt="" />
            <span>Accueil boutique</span>
          </a>

          <a class="admin-public-link" href="./index.html">Vitrine</a>
        </header>

        <section class="admin-products-controls admin-vitrine-controls" aria-label="Résumé accueil boutique">
          <div class="admin-products-stats" aria-label="Résumé de l'accueil">
            <article style="--stat-color:#7C3AED">
              <span class="admin-stat-icon admin-stat-products" aria-hidden="true"></span>
              <strong id="homeCategoryCount">0</strong>
              <small>CATÉGORIES</small>
            </article>
            <article style="--stat-color:#E84B94">
              <span class="admin-stat-icon admin-stat-options" aria-hidden="true"></span>
              <strong id="homeFeaturedCount">0</strong>
              <small>ACCUEIL</small>
            </article>
            <article style="--stat-color:#059669">
              <span class="admin-stat-icon admin-stat-colors" aria-hidden="true"></span>
              <strong id="homeCatalogCount">0</strong>
              <small>CATALOGUE</small>
            </article>
          </div>
        </section>

        <section class="admin-vitrine-content">
          <section class="admin-vitrine-section" aria-labelledby="home-categories-title">
            <div class="admin-products-section-title">
              <div>
                <strong id="home-categories-title">Catégories affichées</strong>
                <small>Choisir et organiser le carrousel</small>
              </div>
            </div>
            <div class="admin-vitrine-category-list" id="homeCategories"></div>
          </section>

          <section class="admin-vitrine-section" aria-labelledby="home-products-title">
            <div class="admin-products-section-title">
              <div>
                <strong id="home-products-title">Nos populaires</strong>
                <small>Cartes visibles sur la première page</small>
              </div>
            </div>
            <div class="admin-vitrine-product-list" id="featuredProducts"></div>
          </section>

          <section class="admin-vitrine-section" aria-labelledby="home-preview-title">
            <div class="admin-products-section-title">
              <div>
                <strong id="home-preview-title">Aperçu rapide</strong>
                <small>Base de la future page d'accueil</small>
              </div>
            </div>
            <div class="admin-vitrine-preview" id="homePreview"></div>
          </section>
        </section>
        <div id="productPickerModal"></div>
        <div id="categoryModal"></div>
      </section>
    </main>

    <script src="./admin-vitrine.js"></script>
  </body>
</html>
