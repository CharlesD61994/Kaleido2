<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atelier Kaleido - Produits</title>
    <meta
      name="description"
      content="Bibliothèque des produits préparés pour la boutique Atelier Kaleido."
    />
    <script src="./admin-guard.js"></script>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./admin.css" />
  </head>
  <body>
    <main class="phone-shell" aria-label="Produits boutique Atelier Kaleido">
      <section class="storefront admin-storefront">
        <header class="topbar admin-topbar" aria-label="Navigation admin">
          <a class="admin-back-button admin-header-back" href="./admin.html" aria-label="Retour">←</a>
          <a class="brand" href="./admin.html" aria-label="Retour au tableau de bord admin">
            <img src="./assets/kaleido-logo.jpg" alt="" />
            <span>Produits</span>
          </a>
        </header>

        <section class="admin-products-controls" aria-label="Recherche et filtres produits">
          <div class="admin-products-stats" aria-label="Résumé des produits">
            <article style="--stat-color:#7C3AED">
              <span class="admin-stat-icon admin-stat-products" aria-hidden="true"></span>
              <strong id="productCount">0</strong>
              <small>PRODUITS</small>
            </article>
            <article style="--stat-color:#0891B2">
              <span class="admin-stat-icon admin-stat-options" aria-hidden="true"></span>
              <strong id="optionCount">0</strong>
              <small>OPTIONS</small>
            </article>
            <article style="--stat-color:#059669">
              <span class="admin-stat-icon admin-stat-colors" aria-hidden="true"></span>
              <strong id="colorCount">0</strong>
              <small>COULEURS</small>
            </article>
          </div>

          <label class="admin-products-search">
            <span aria-hidden="true"></span>
            <input id="productSearch" type="search" placeholder="Rechercher un produit..." />
          </label>

          <div class="admin-products-tags" id="productFilters" aria-label="Filtres produits">
            <button class="is-active" type="button" data-filter="Tous">Tous</button>
            <button type="button" data-filter="Brouillons">Brouillons</button>
            <button type="button" data-filter="Catalogue">Catalogue</button>
            <button type="button" data-filter="Hors catalogue">Hors catalogue</button>
            <button type="button" data-filter="Vêtement">Vêtements</button>
            <button type="button" data-filter="Amigurumi">Amigurumi</button>
            <button type="button" data-filter="Pantoufles">Pantoufles</button>
            <button type="button" data-filter="Porte-clé">Porte-clés</button>
            <button type="button" data-filter="Couverture">Couvertures</button>
          </div>
        </section>

        <section class="admin-products-panel" aria-label="Produits">
          <div class="admin-products-grid" id="productsGrid"></div>
        </section>
      </section>
    </main>

    <script src="./storefront-config.js"></script>
    <script src="./storefront-cloud.js"></script>
    <script src="./admin-products.js"></script>
  </body>
</html>
